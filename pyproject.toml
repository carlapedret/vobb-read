[project]
name = "vobb-read"
version = "0.1.0"
description = "Check which books on a Goodreads shelf (physical, English-language) are held at specific VÖBB (Berlin public library) branches."
requires-python = ">=3.10"
dependencies = [
    "feedparser>=6.0",
    "requests>=2.31",
    "playwright>=1.44",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vobb-read = "vobb_read.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vobb_read*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
